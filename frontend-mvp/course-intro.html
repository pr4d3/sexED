<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khóa học - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .intro-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            margin: 40px 0 80px;
        }
        .intro-img {
            width: 100%;
            height: 350px;
            background: var(--bg-darker);
            border-radius: var(--radius-md);
            object-fit: cover;
            margin-bottom: 24px;
        }
        .syllabus-list {
            margin-top: 32px;
        }
        .syllabus-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
        }
        .syllabus-item h4 {
            font-size: 15px;
            font-weight: 500;
        }
        .instructor-card {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
        }
        .instructor-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--primary);
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <main class="container">
        <div id="loading" style="text-align: center; padding: 100px 0;">
            <p style="color: var(--text-muted);">Đang tải chi tiết khóa học...</p>
        </div>

        <div id="intro-content" class="intro-grid" style="display: none;">
            <div>
                <img id="course-thumbnail" src="" class="intro-img" alt="Course Thumbnail">
                <h1 id="course-title" style="font-size: 36px; margin-bottom: 16px;">Tên khóa học</h1>
                <p id="course-description" style="color: var(--text-muted); font-size: 16px; line-height: 1.8;">Mô tả khóa học</p>
                
                <div class="syllabus-list">
                    <h3 style="font-size: 22px; margin-bottom: 16px;">Đề cương bài học</h3>
                    <div id="syllabus-container">
                        <!-- Syllabus items go here -->
                    </div>
                </div>
            </div>

            <div>
                <div class="card" style="position: sticky; top: 96px;">
                    <h3 style="font-size: 20px; margin-bottom: 16px;">Đăng ký khóa học</h3>
                    <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">
                        <p style="margin-bottom: 8px;">Đối tượng: <strong id="course-audience">Tất cả</strong></p>
                        <p>Tổng số bài học: <strong id="course-lessons-count">0</strong> bài</p>
                    </div>
                    
                    <button id="action-btn" onclick="handleAction()" class="btn btn-primary" style="width: 100%; font-size: 16px;">Đăng ký ngay</button>
                    
                    <div class="instructor-card">
                        <img id="ins-avatar" src="" class="instructor-avatar" alt="Instructor Avatar">
                        <div>
                            <span style="font-size: 12px; color: var(--text-muted); display: block;">Giảng viên</span>
                            <strong id="ins-name" style="font-size: 14px;">Tên giảng viên</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');
        let courseData = null;

        if (!courseId) {
            window.location.href = "courses.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadCourseDetail();
        });

        async function loadCourseDetail() {
            try {
                const res = await api.get(`/courses/${courseId}/intro`);
                if (res.success) {
                    courseData = res.data;
                    renderDetail();
                }
            } catch (err) {
                document.getElementById('loading').innerHTML = `
                    <p style="color: var(--danger);">${err.message || 'Lỗi khi tải chi tiết khóa học.'}</p>
                    <a href="courses.html" class="btn btn-outline" style="margin-top: 16px;">Quay lại danh sách</a>
                `;
            }
        }

        function renderDetail() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('intro-content').style.display = 'grid';

            document.getElementById('course-thumbnail').src = courseData.thumbnail_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800';
            document.getElementById('course-title').textContent = courseData.title;
            document.getElementById('course-description').textContent = courseData.description || courseData.short_description || 'Chưa có mô tả chi tiết cho khóa học này.';
            
            const aud = courseData.target_audience;
            document.getElementById('course-audience').textContent = aud === 'PARENT' ? 'Phụ huynh' : aud === 'CHILD' ? 'Trẻ dậy thì' : 'Mọi đối tượng';
            document.getElementById('course-lessons-count').textContent = courseData.total_lessons;

            document.getElementById('ins-avatar').src = courseData.instructor.avatar_url || 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100';
            document.getElementById('ins-name').textContent = courseData.instructor.full_name;

            const container = document.getElementById('syllabus-container');
            if (courseData.syllabus.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted);">Đề cương đang được cập nhật.</p>`;
            } else {
                container.innerHTML = courseData.syllabus.map(lesson => `
                    <div class="syllabus-item">
                        <h4>Bài ${lesson.order_index}: ${lesson.title}</h4>
                        ${lesson.duration_minutes ? `<span style="font-size: 13px; color: var(--text-muted);">${lesson.duration_minutes} phút</span>` : ''}
                    </div>
                `).join('');
            }

            const btn = document.getElementById('action-btn');
            if (courseData.is_enrolled) {
                btn.textContent = "Vào học ngay";
                btn.className = "btn btn-accent";
            } else {
                btn.textContent = "Đăng ký khóa học";
                btn.className = "btn btn-primary";
            }
        }

        async function handleAction() {
            if (!api.isAuthenticated()) {
                window.location.href = `auth.html`;
                return;
            }

            if (courseData.is_enrolled) {
                window.location.href = `course-learn.html?id=${courseId}`;
                return;
            }

            const btn = document.getElementById('action-btn');
            btn.disabled = true;
            btn.textContent = "Đang xử lý...";
            
            try {
                const res = await api.post(`/courses/${courseId}/enroll`);
                if (res.success) {
                    alert("Đăng ký học thành công!");
                    window.location.href = `course-learn.html?id=${courseId}`;
                }
            } catch (err) {
                alert(err.message || "Không thể đăng ký học.");
                btn.disabled = false;
                btn.textContent = "Đăng ký khóa học";
            }
        }
    </script>
</body>
</html>
