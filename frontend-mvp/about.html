<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới Thiệu Đề Tài - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .about-header {
            padding: 60px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-card);
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.05) 0%, transparent 100%);
        }
        .about-header h1 {
            font-size: 36px;
            margin-bottom: 16px;
        }
        .about-content {
            margin: 60px 0;
        }
        .about-section {
            margin-bottom: 48px;
        }
        .about-section h3 {
            font-size: 24px;
            margin-bottom: 16px;
            color: var(--primary);
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 8px;
        }
        .about-section p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .member-card {
            text-align: center;
        }
        .member-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
        }
        .member-card h4 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        .member-card p {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .member-card span {
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <section class="about-header">
        <div class="container">
            <h1>Giới Thiệu Đề Tài Nghiên Cứu</h1>
            <p style="color: var(--text-muted); max-width: 700px; margin: 0 auto;">Nền tảng E-learning phục vụ Nghiên cứu khoa học và Giáo dục giới tính toàn diện cho thanh thiếu niên và phụ huynh Việt Nam</p>
        </div>
    </section>

    <main class="container about-content">
        <div id="project" class="about-section card">
            <h3 id="research-title">Đang tải tên đề tài...</h3>
            <p id="research-purpose">Đang tải mục tiêu đề tài...</p>
        </div>

        <div class="about-section card">
            <h3>Phương pháp nghiên cứu</h3>
            <p id="methodology">Đang tải phương pháp...</p>
        </div>

        <div id="team" class="about-section">
            <h3>Nhóm tác giả & Phát triển</h3>
            <div id="team-grid" class="team-grid">
                <!-- Authors load here -->
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await api.get('/general/about-us');
                if (res.success) {
                    const data = res.data;
                    document.getElementById('research-title').textContent = data.research_title;
                    document.getElementById('research-purpose').textContent = data.research_purpose;
                    document.getElementById('methodology').textContent = data.methodology;

                    const grid = document.getElementById('team-grid');
                    grid.innerHTML = data.authors.map(author => `
                        <div class="card member-card">
                            <div class="member-avatar">${author.name.charAt(0)}</div>
                            <h4>${author.name}</h4>
                            <p>${author.role}</p>
                            <span>Liên hệ: ${author.contact}</span>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("Error loading about us data", err);
            }
        });
    </script>
</body>
</html>
