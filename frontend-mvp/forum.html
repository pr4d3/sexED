<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diễn Đàn Cộng Đồng - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .forum-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 32px;
            margin: 40px 0 80px;
        }
        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .category-btn {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }
        .category-btn:hover, .category-btn.active {
            background: rgba(124, 58, 237, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }
        
        .post-card {
            border-left: 4px solid var(--primary);
            margin-bottom: 20px;
            cursor: pointer;
        }
        .post-card h3 {
            font-size: 18px;
            margin-bottom: 12px;
        }
        .post-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
        }
        
        .detail-header {
            border-bottom: 1px solid var(--border-card);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .detail-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .post-body {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        
        .comments-section h3 {
            font-size: 20px;
            margin-bottom: 20px;
            border-top: 1px solid var(--border-card);
            padding-top: 32px;
        }
        .comment-node {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 16px;
        }
        .comment-node.reply {
            margin-left: 40px;
            border-left: 3px solid var(--primary);
        }
        .comment-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .comment-content {
            font-size: 14px;
        }
        .comment-actions {
            margin-top: 8px;
            display: flex;
            gap: 16px;
        }
        .action-link {
            font-size: 12px;
            color: var(--primary);
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .action-link:hover {
            text-decoration: underline;
        }
        .action-link.admin-action {
            color: var(--danger);
        }
        
        .reply-form {
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <main class="container">
        <!-- Forum Feed View -->
        <div id="forum-feed-view" class="forum-grid">
            <aside>
                <button id="create-post-trigger" onclick="openCreatePostModal()" class="btn btn-primary" style="width: 100%; margin-bottom: 24px; display: none;">Tạo thảo luận</button>
                <h3 style="font-size: 16px; margin-bottom: 16px;">Chuyên mục</h3>
                <ul id="categories-container" class="category-list">
                    <!-- Categories listed dynamically -->
                </ul>
            </aside>
            
            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="font-size: 24px;">Bài Thảo Luận</h2>
                    <input type="text" id="search-input" oninput="handleSearch()" class="form-control" style="width: 250px;" placeholder="Tìm kiếm thảo luận...">
                </div>
                <div id="posts-container">
                    <!-- Posts load here -->
                </div>
            </section>
        </div>

        <!-- Post Detail View -->
        <div id="post-detail-view" style="display: none; max-width: 800px; margin: 40px auto 80px;">
            <a href="forum.html" class="btn btn-outline" style="margin-bottom: 32px;">&larr; Quay lại diễn đàn</a>
            
            <div class="card">
                <article>
                    <header class="detail-header">
                        <span id="detail-category" class="badge parent" style="margin-bottom: 12px; display: inline-block;">Category</span>
                        <h1 id="detail-title" style="font-size: 32px; line-height: 1.3; margin-bottom: 12px;">Tiêu đề chi tiết bài viết</h1>
                        <div class="detail-meta">
                            <span>Bởi: <strong id="detail-author">Tên tác giả</strong></span>
                            <span>Ngày đăng: <strong id="detail-date">Ngày</strong></span>
                            <span id="post-admin-actions" style="display: none;">
                                <button onclick="moderatePost('HIDE')" class="action-link admin-action">Ẩn bài</button> | 
                                <button onclick="moderatePost('DELETE')" class="action-link admin-action">Xóa bài</button>
                            </span>
                        </div>
                    </header>
                    
                    <div id="detail-body" class="post-body">
                        Nội dung bài viết...
                    </div>
                </article>

                <div class="comments-section">
                    <h3>Ý kiến thảo luận (<span id="comments-count">0</span>)</h3>
                    
                    <div id="comment-form-sec" style="display: none; margin-bottom: 32px;">
                        <form onsubmit="handleCommentSubmit(event, null)">
                            <div class="form-group">
                                <textarea id="main-comment-text" class="form-control" rows="3" required placeholder="Chia sẻ suy nghĩ, ý kiến đóng góp khoa học của bạn..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Gửi ý kiến</button>
                        </form>
                    </div>
                    <div id="login-to-comment-sec" style="display: block; margin-bottom: 32px; color: var(--text-muted);">
                        Vui lòng <a href="auth.html" style="color: var(--primary);">Đăng nhập</a> để tham gia thảo luận.
                    </div>

                    <div id="comments-container">
                        <!-- Hierarchical comments list here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Post Modal -->
    <div id="create-post-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCreatePostModal()">&times;</button>
            <h3 style="font-size: 20px; margin-bottom: 20px;">Tạo Thảo Luận Mới</h3>
            <form onsubmit="handleCreatePost(event)">
                <div class="form-group">
                    <label class="form-label" for="post-category-select">Chuyên mục</label>
                    <select class="form-control" id="post-category-select" required>
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="post-title-input">Tiêu đề bài viết</label>
                    <input class="form-control" type="text" id="post-title-input" required minlength="5" placeholder="Ví dụ: Cách nhận biết thay đổi tâm lý tuổi dậy thì">
                </div>
                <div class="form-group">
                    <label class="form-label" for="post-content-input">Nội dung chi tiết</label>
                    <textarea class="form-control" id="post-content-input" rows="6" required minlength="10" placeholder="Viết nội dung bài thảo luận tại đây..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng bài thảo luận</button>
            </form>
        </div>
    </div>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('post_id');
        let categories = [];
        let selectedCategory = null;
        let searchTimeout = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadCategories();

            if (api.isAuthenticated()) {
                document.getElementById('create-post-trigger').style.display = 'block';
                document.getElementById('comment-form-sec').style.display = 'block';
                document.getElementById('login-to-comment-sec').style.display = 'none';
            }

            if (postId) {
                document.getElementById('forum-feed-view').style.display = 'none';
                document.getElementById('post-detail-view').style.display = 'block';
                loadPostDetail();
            } else {
                document.getElementById('forum-feed-view').style.display = 'grid';
                document.getElementById('post-detail-view').style.display = 'none';
                loadPosts();
            }
        });

        async function loadCategories() {
            try {
                const res = await api.get('/forum/categories');
                if (res.success) {
                    categories = res.data;
                    
                    const menu = document.getElementById('categories-container');
                    menu.innerHTML = `
                        <li><button class="category-btn active" id="cat-btn-all" onclick="selectCategory(null)">Tất cả chuyên mục</button></li>
                    ` + categories.map(cat => `
                        <li><button class="category-btn" id="cat-btn-${cat.id}" onclick="selectCategory(${cat.id})">${cat.name}</button></li>
                    `).join('');

                    const select = document.getElementById('post-category-select');
                    select.innerHTML = categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
                }
            } catch (err) {
                console.error("Error loading categories", err);
            }
        }

        function selectCategory(catId) {
            selectedCategory = catId;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            
            if (catId === null) {
                document.getElementById('cat-btn-all').classList.add('active');
            } else {
                document.getElementById(`cat-btn-${catId}`).classList.add('active');
            }
            loadPosts();
        }

        async function loadPosts(search = '') {
            const container = document.getElementById('posts-container');
            container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px 0;">Đang tải bài thảo luận...</p>';
            
            try {
                let url = '/forum/posts';
                const params = [];
                if (selectedCategory) params.push(`category_id=${selectedCategory}`);
                if (search) params.push(`search=${encodeURIComponent(search)}`);
                
                if (params.length > 0) {
                    url += '?' + params.join('&');
                }
                
                const res = await api.get(url);
                if (res.success) {
                    renderPosts(res.data);
                }
            } catch (err) {
                container.innerHTML = `<p style="color: var(--danger); text-align: center; padding: 40px 0;">${err.message || 'Lỗi tải diễn đàn.'}</p>`;
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            if (posts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px 0;">Không tìm thấy bài viết nào phù hợp.</p>';
                return;
            }
            
            container.innerHTML = posts.map(post => `
                <div class="card post-card" onclick="window.location.href='forum.html?post_id=${post.id}'">
                    <h3>${post.title}</h3>
                    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">${post.short_content}</p>
                    <div class="post-meta">
                        <span>Chuyên mục: <strong>${post.category_name}</strong></span>
                        <span>Đăng bởi: <strong>${post.author.full_name} (${post.author.role === 'INSTRUCTOR' ? 'Giảng viên' : post.author.role === 'ADMIN' ? 'Admin' : 'Học viên'})</strong></span>
                        <span>Phản hồi: <strong>${post.comment_count}</strong></span>
                    </div>
                </div>
            `).join('');
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value;
            searchTimeout = setTimeout(() => {
                loadPosts(query);
            }, 500);
        }

        function openCreatePostModal() {
            document.getElementById('create-post-modal').classList.add('active');
        }
        function closeCreatePostModal() {
            document.getElementById('create-post-modal').classList.remove('active');
        }
        async function handleCreatePost(event) {
            event.preventDefault();
            const category_id = parseInt(document.getElementById('post-category-select').value);
            const title = document.getElementById('post-title-input').value;
            const content = document.getElementById('post-content-input').value;

            try {
                const res = await api.post('/forum/posts', { category_id, title, content });
                if (res.success) {
                    alert("Đăng bài viết thành công!");
                    closeCreatePostModal();
                    document.getElementById('post-title-input').value = '';
                    document.getElementById('post-content-input').value = '';
                    loadPosts();
                }
            } catch (err) {
                alert("Lỗi khi đăng bài: " + err.message);
            }
        }

        async function loadPostDetail() {
            try {
                const res = await api.get(`/forum/posts/${postId}`);
                if (res.success) {
                    const post = res.data;
                    document.getElementById('detail-category').textContent = post.category_name;
                    document.getElementById('detail-title').textContent = post.title;
                    
                    const roleText = post.author.role === 'ADMIN' ? 'Admin' : post.author.role === 'INSTRUCTOR' ? 'Giảng viên' : 'Học viên';
                    document.getElementById('detail-author').textContent = `${post.author.full_name} (${roleText})`;
                    
                    const postDate = new Date(post.created_at);
                    document.getElementById('detail-date').textContent = postDate.toLocaleDateString('vi-VN') + ' ' + postDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    document.getElementById('detail-body').innerHTML = post.content.replace(/\n/g, '<br>');

                    document.getElementById('comments-count').textContent = countTotalComments(post.comments);
                    renderComments(post.comments);

                    const user = api.getUserInfo();
                    if (user && user.role === 'ADMIN') {
                        document.getElementById('post-admin-actions').style.display = 'inline';
                    }
                }
            } catch (err) {
                document.getElementById('post-detail-view').innerHTML = `
                    <p style="color: var(--danger); text-align: center; padding: 40px 0;">${err.message || 'Lỗi tải chi tiết bài viết.'}</p>
                    <a href="forum.html" class="btn btn-outline" style="margin-top: 16px;">Quay lại diễn đàn</a>
                `;
            }
        }

        function countTotalComments(comments) {
            let count = comments.length;
            for (const c of comments) {
                if (c.replies) {
                    count += countTotalComments(c.replies);
                }
            }
            return count;
        }

        function renderComments(comments) {
            const container = document.getElementById('comments-container');
            if (comments.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); padding: 16px 0;">Chưa có bình luận nào cho thảo luận này.</p>';
                return;
            }

            container.innerHTML = buildCommentsHtml(comments);
        }

        function buildCommentsHtml(comments, isReply = false) {
            const user = api.getUserInfo();
            const isAdmin = user && user.role === 'ADMIN';
            const isLoggedIn = api.isAuthenticated();

            return comments.map(comment => {
                const commentDate = new Date(comment.created_at);
                const dateStr = commentDate.toLocaleDateString('vi-VN') + ' ' + commentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const roleText = comment.author.role === 'ADMIN' ? 'Admin' : comment.author.role === 'INSTRUCTOR' ? 'Giảng viên' : 'Học viên';
                
                return `
                    <div class="comment-node ${isReply ? 'reply' : ''}">
                        <div class="comment-meta">
                            <span><strong>${comment.author.full_name} (${roleText})</strong> <span style="color: var(--text-muted); font-size: 11px; margin-left: 8px;">${dateStr}</span></span>
                            ${comment.status !== 'PUBLISHED' ? `<span class="badge" style="color: var(--danger); border-color: var(--danger);">${comment.status}</span>` : ''}
                        </div>
                        <div class="comment-content">
                            ${comment.content}
                        </div>
                        <div class="comment-actions">
                            ${isLoggedIn ? `<button onclick="toggleReplyForm('${comment.id}')" class="action-link">Trả lời</button>` : ''}
                            ${isAdmin ? `
                                <button onclick="moderateComment('${comment.id}', 'HIDE')" class="action-link admin-action">Ẩn</button>
                                <button onclick="moderateComment('${comment.id}', 'DELETE')" class="action-link admin-action">Xóa</button>
                            ` : ''}
                        </div>
                        
                        <div id="reply-form-${comment.id}" class="reply-form">
                            <form onsubmit="handleCommentSubmit(event, '${comment.id}')">
                                <div class="form-group" style="margin-bottom: 12px;">
                                    <textarea id="reply-text-${comment.id}" class="form-control" rows="2" required placeholder="Viết câu trả lời..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-accent btn-sm" style="padding: 6px 12px; font-size: 12px;">Gửi trả lời</button>
                                <button type="button" onclick="toggleReplyForm('${comment.id}')" class="btn btn-outline btn-sm" style="padding: 6px 12px; font-size: 12px; border:none;">Hủy</button>
                            </form>
                        </div>
                    </div>
                    ${comment.replies && comment.replies.length > 0 ? buildCommentsHtml(comment.replies, true) : ''}
                `;
            }).join('');
        }

        function toggleReplyForm(commentId) {
            const form = document.getElementById(`reply-form-${commentId}`);
            if (form.style.display === 'block') {
                form.style.display = 'none';
            } else {
                form.style.display = 'block';
            }
        }

        async function handleCommentSubmit(event, parentCommentId) {
            event.preventDefault();
            const textarea = parentCommentId ? document.getElementById(`reply-text-${parentCommentId}`) : document.getElementById('main-comment-text');
            const content = textarea.value;

            try {
                const res = await api.post(`/forum/posts/${postId}/comments`, { content, parent_comment_id: parentCommentId });
                if (res.success) {
                    textarea.value = '';
                    if (parentCommentId) {
                        toggleReplyForm(parentCommentId);
                    }
                    loadPostDetail();
                }
            } catch (err) {
                alert("Lỗi gửi bình luận: " + err.message);
            }
        }

        async function moderatePost(action) {
            if (!confirm(`Bạn chắc chắn muốn thực hiện hành động [${action}] đối với bài viết này?`)) return;
            try {
                const res = await api.put(`/admin/forum/posts/${postId}/moderate`, { action });
                if (res.success) {
                    alert("Cập nhật bài viết thành công!");
                    window.location.href = "forum.html";
                }
            } catch (err) {
                alert("Không thể kiểm duyệt bài viết: " + err.message);
            }
        }

        async function moderateComment(commentId, action) {
            if (!confirm(`Bạn chắc chắn muốn thực hiện hành động [${action}] đối với bình luận này?`)) return;
            try {
                const res = await api.put(`/admin/forum/comments/${commentId}/moderate`, { action });
                if (res.success) {
                    alert("Cập nhật bình luận thành công!");
                    loadPostDetail();
                }
            } catch (err) {
                alert("Không thể kiểm duyệt bình luận: " + err.message);
            }
        }
    </script>
</body>
</html>
