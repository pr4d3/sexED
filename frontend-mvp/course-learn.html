<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không gian học tập - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .learn-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: calc(100vh - 72px);
            overflow: hidden;
        }
        
        .learn-sidebar {
            background: var(--bg-darker);
            border-right: 1px solid var(--border-card);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .progress-container {
            padding: 20px;
            border-bottom: 1px solid var(--border-card);
        }
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }
        .lessons-menu {
            list-style: none;
            padding: 12px 0;
        }
        .lesson-btn {
            width: 100%;
            padding: 16px 20px;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
            font-size: 14px;
        }
        .lesson-btn:hover {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
        }
        .lesson-btn.active {
            background: rgba(124, 58, 237, 0.1);
            color: var(--primary);
            border-left: 3px solid var(--primary);
        }
        .lesson-status {
            font-size: 16px;
        }
        .lesson-status.completed {
            color: var(--success);
        }
        .lesson-status.pending {
            color: var(--text-muted);
            opacity: 0.3;
        }

        .learn-content {
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .video-wrapper iframe, .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .reading-area {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-main);
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>
    <header class="navbar" style="position: relative; z-index: 10;"></header>

    <div id="loading-screen" style="text-align: center; padding: 100px 0;">
        <p style="color: var(--text-muted);">Đang tải bài học...</p>
    </div>

    <main id="main-learn" class="learn-layout" style="display: none;">
        <aside class="learn-sidebar">
            <div class="progress-container">
                <span style="font-size: 13px; color: var(--text-muted);">Tiến độ khóa học: <strong id="progress-text">0%</strong></span>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
            
            <ul id="lessons-list" class="lessons-menu">
                <!-- Lessons listed dynamically -->
            </ul>
        </aside>

        <section id="content-panel" class="learn-content">
            <div id="video-section" style="display: none;">
                <div class="video-wrapper">
                    <video id="lesson-video" controls src=""></video>
                </div>
            </div>
            
            <div>
                <h1 id="lesson-title" style="font-size: 28px; margin-bottom: 8px;">Tên bài học</h1>
                <span style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 24px;">Không gian học tập chuẩn y khoa</span>
            </div>

            <div id="reading-section" class="reading-area" style="display: none;">
                <!-- Text body -->
            </div>

            <div style="margin-top: 32px; border-top: 1px solid var(--border-card); padding-top: 24px; display: flex; justify-content: space-between; align-items: center;">
                <button id="prev-btn" onclick="navigateLesson(-1)" class="btn btn-outline">Bài Trước</button>
                <button id="complete-btn" onclick="handleComplete()" class="btn btn-success">Đánh dấu hoàn thành</button>
                <button id="next-btn" onclick="navigateLesson(1)" class="btn btn-outline">Bài Tiếp</button>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');
        let learnData = null;
        let activeIdx = 0;

        if (!courseId) {
            window.location.href = "courses.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadLearningRoom();
        });

        async function loadLearningRoom() {
            try {
                const res = await api.get(`/courses/${courseId}/learn`);
                if (res.success) {
                    learnData = res.data;
                    renderSidebar();
                    selectLesson(0);
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-learn').style.display = 'grid';
                }
            } catch (err) {
                document.getElementById('loading-screen').innerHTML = `
                    <p style="color: var(--danger);">${err.message || 'Lỗi kết nối học tập.'}</p>
                    <a href="courses.html" class="btn btn-outline" style="margin-top: 16px;">Quay lại danh sách</a>
                `;
            }
        }

        function renderSidebar() {
            const pct = learnData.progress_percentage;
            document.getElementById('progress-text').textContent = `${pct}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            const container = document.getElementById('lessons-list');
            container.innerHTML = learnData.lessons.map((lesson, idx) => `
                <li>
                    <button id="btn-lesson-${idx}" class="lesson-btn ${idx === activeIdx ? 'active' : ''}" onclick="selectLesson(${idx})">
                        <span>Bài ${lesson.order_index}: ${lesson.title}</span>
                        <span class="lesson-status ${lesson.is_completed ? 'completed' : 'pending'}">
                            ${lesson.is_completed ? '✓' : '○'}
                        </span>
                    </button>
                </li>
            `).join('');
        }

        function selectLesson(idx) {
            activeIdx = idx;
            
            document.querySelectorAll('.lesson-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-lesson-${idx}`);
            if (activeBtn) activeBtn.classList.add('active');

            const lesson = learnData.lessons[idx];
            document.getElementById('lesson-title').textContent = lesson.title;
            
            const videoSec = document.getElementById('video-section');
            const videoEl = document.getElementById('lesson-video');
            if (lesson.content_type !== 'TEXT' && lesson.video_url) {
                videoSec.style.display = 'block';
                videoEl.src = lesson.video_url;
            } else {
                videoSec.style.display = 'none';
                videoEl.src = '';
            }

            const textSec = document.getElementById('reading-section');
            if (lesson.content_type !== 'VIDEO' && lesson.content_body) {
                textSec.style.display = 'block';
                textSec.innerHTML = lesson.content_body;
            } else {
                textSec.style.display = 'none';
                textSec.innerHTML = '';
            }

            const compBtn = document.getElementById('complete-btn');
            if (lesson.is_completed) {
                compBtn.disabled = true;
                compBtn.textContent = "Đã hoàn thành";
                compBtn.style.opacity = 0.5;
            } else {
                compBtn.disabled = false;
                compBtn.textContent = "Đánh dấu hoàn thành";
                compBtn.style.opacity = 1;
            }

            document.getElementById('prev-btn').disabled = idx === 0;
            document.getElementById('next-btn').disabled = idx === learnData.lessons.length - 1;
        }

        function navigateLesson(dir) {
            const nextIdx = activeIdx + dir;
            if (nextIdx >= 0 && nextIdx < learnData.lessons.length) {
                selectLesson(nextIdx);
            }
        }

        async function handleComplete() {
            const lesson = learnData.lessons[activeIdx];
            const compBtn = document.getElementById('complete-btn');
            
            compBtn.disabled = true;
            compBtn.textContent = "Đang ghi nhận...";
            
            try {
                const res = await api.post(`/users/courses/${courseId}/lessons/${lesson.lesson_id}/complete`);
                if (res.success) {
                    lesson.is_completed = true;
                    learnData.progress_percentage = res.data.progress_percentage;
                    
                    renderSidebar();
                    selectLesson(activeIdx);
                    
                    if (res.data.is_course_just_completed) {
                        alert("Chúc mừng! Bạn đã hoàn thành 100% khóa học!");
                        window.location.href = `course-outro.html?id=${courseId}`;
                    }
                }
            } catch (err) {
                alert(err.message || "Lỗi ghi nhận hoàn thành bài học.");
                compBtn.disabled = false;
                compBtn.textContent = "Đánh dấu hoàn thành";
            }
        }
    </script>
</body>
</html>
