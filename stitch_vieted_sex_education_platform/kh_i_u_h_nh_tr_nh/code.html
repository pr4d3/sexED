<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Khởi đầu Hành trình</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#6d3a00",

                        "error": "#ba1a1a",
                        "inverse-primary": "#82d7b2",
                        "on-primary-fixed-variant": "#00513a",
                        "on-secondary-fixed": "#2e1500",
                        "on-surface-variant": "#3f4943",
                        "surface-container-high": "#e7e8e9",
                        "background": "#f8f9fa",
                        "primary-fixed-dim": "#82d7b2",
                        "primary-container": "#006b4d",
                        "tertiary-container": "#00667b",
                        "surface-container": "#edeeef",
                        "surface-dim": "#d9dadb",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-variant": "#e1e3e4",
                        "surface-container-low": "#f3f4f5",
                        "surface-container-highest": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "secondary": "#8f4e00",
                        "outline": "#6f7a73",
                        "secondary-fixed": "#ffdcc2",
                        "on-primary-fixed": "#002115",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bec9c1",
                        "secondary-container": "#fc9d41",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#001f27",
                        "primary-fixed": "#9ef4cd",
                        "secondary-fixed-dim": "#ffb77a",
                        "tertiary-fixed-dim": "#4ed6fb",
                        "on-error": "#ffffff",
                        "surface-tint": "#026c4e",
                        "on-tertiary-fixed-variant": "#004e5f",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#93e8c2",
                        "on-secondary": "#ffffff",
                        "tertiary": "#004d5d",
                        "surface-bright": "#f8f9fa",
                        "inverse-surface": "#2e3132"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "8px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px",
                        "card-padding": "32px",
                        "container-max-width": "1280px"
                    },
                    "fontFamily": {
                        "title-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],

                    },
                    "fontSize": {

                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        
        .gradient-btn {
            background: linear-gradient(135deg, var(--tw-colors-primary-container) 0%, var(--tw-colors-primary) 100%);
            box-shadow: 0 4px 15px rgba(0, 80, 57, 0.2);
        }
        .gradient-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 80, 57, 0.3);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden flex flex-col lg:flex-row p-4 lg:p-6 gap-6 bg-gradient-to-br from-surface to-surface-container-low">
<!-- Left Side: Illustration & Message (Hidden on Mobile) -->
<div class="hidden lg:flex w-1/2 bg-surface-container-lowest/50 backdrop-blur-sm rounded-[2rem] flex-col justify-center items-center p-12 relative overflow-hidden shadow-sm border border-white/60">
<!-- Background Soft Shapes -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary-fixed/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
<div class="absolute top-[20%] right-[-10%] w-72 h-72 bg-tertiary-fixed/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
<div class="absolute bottom-[-10%] left-[20%] w-80 h-80 bg-secondary-fixed/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
<div class="z-10 max-w-md text-center">
<img class="w-full h-auto mb-8 rounded-[2rem] object-contain drop-shadow-xl" data-alt="A modern, clinical yet warm flat-vector illustration depicting safe sex education. Features abstract, rounded shapes in shades of medical blue and soft white, showing a stylized anatomical or educational metaphor. The lighting is bright and clean, evoking trust and scientific rigor within a clinical minimalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsiyh6bFSuXSuCrjsf6Bf7piF2fQ-fR_AqzwgGj7Rt6vN9NJ3eR8thPqU3NI6ckUUgpJhtE2eJLicVNwUh2dATYjkI-s462wFpkkCIrJVfjBhOwJK5TiWdc5--DEgJY38IV6u5JzNw9zEhYNOGx7fO2X1aoKwqzkcq6hhC1Bl9HM25dJPdaUjWhwl3GQfivxkudE6XgYPLllKQc0c_FSjpY9nPzU19zYAEFCFtWO7jTD5507bWPcILbg"/>
<h1 class="font-headline-lg text-headline-lg text-primary mb-4 drop-shadow-sm">Kiến thức là Sức mạnh</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Nền tảng giáo dục giới tính an toàn, khoa học và đáng tin cậy. Xây dựng môi trường học tập cởi mở và tôn trọng.</p>
</div>
</div>
<!-- Right Side: Auth Forms -->
<div class="w-full lg:w-1/2 flex justify-center items-center h-full overflow-y-auto">
<div class="w-full max-w-md glass-panel rounded-[2rem] p-card-padding flex flex-col gap-6">
<!-- Branding -->
<div class="text-center mb-2">
<h2 class="font-headline-lg text-headline-lg-mobile text-primary font-bold">Khởi đầu Hành trình</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2" id="auth-subtitle">Tạo tài khoản mới</p>
</div>
<!-- Tab Switcher -->
<div class="flex p-1.5 bg-white/50 backdrop-blur-md rounded-2xl mb-4 border border-white/60 shadow-inner">
<button class="flex-1 py-3 rounded-xl font-label-sm text-label-sm text-center transition-all bg-white text-primary shadow-sm font-bold" id="tab-register" onclick="switchTab('register')">Đăng ký</button>
<button class="flex-1 py-3 rounded-xl font-label-sm text-label-sm text-center transition-all text-on-surface-variant hover:text-on-surface hover:bg-white/30" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
</div>
<!-- Register Form -->
<form class="flex flex-col gap-5" id="form-register">
<!-- Role Selector -->
<div class="grid grid-cols-2 gap-4 mb-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="parent"/>
<div class="flex flex-col items-center justify-center p-5 rounded-2xl border border-white/60 bg-white/40 backdrop-blur-sm peer-checked:border-primary peer-checked:bg-primary-fixed/30 peer-checked:shadow-sm transition-all hover:bg-white/60">
<span class="material-symbols-outlined text-primary mb-2 text-3xl" style="font-variation-settings: 'FILL' 1;">family_home</span>
<span class="font-label-sm text-label-sm text-on-surface">Phụ huynh</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="student"/>
<div class="flex flex-col items-center justify-center p-5 rounded-2xl border border-white/60 bg-white/40 backdrop-blur-sm peer-checked:border-primary peer-checked:bg-primary-fixed/30 peer-checked:shadow-sm transition-all hover:bg-white/60">
<span class="material-symbols-outlined text-primary mb-2 text-3xl" style="font-variation-settings: 'FILL' 1;">backpack</span>
<span class="font-label-sm text-label-sm text-on-surface">Học sinh</span>
</div>
</label>
</div>
<!-- Inputs -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface ml-1">Họ và tên</label>
<input class="w-full px-5 py-4 rounded-2xl bg-white/50 border border-white/60 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline backdrop-blur-sm shadow-inner" placeholder="Nhập họ và tên" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface ml-1">Email</label>
<input class="w-full px-5 py-4 rounded-2xl bg-white/50 border border-white/60 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline backdrop-blur-sm shadow-inner" placeholder="example@email.com" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface ml-1">Mật khẩu</label>
<input class="w-full px-5 py-4 rounded-2xl bg-white/50 border border-white/60 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline backdrop-blur-sm shadow-inner" placeholder="••••••••" type="password"/>
</div>
<button class="w-full mt-4 gradient-btn text-on-primary py-4 rounded-2xl font-label-sm text-label-sm font-bold transition-all duration-300" type="button">Đăng ký</button>
</form>
<!-- Login Form (Hidden by default) -->
<form class="hidden flex-col gap-5" id="form-login">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface ml-1">Email</label>
<input class="w-full px-5 py-4 rounded-2xl bg-white/50 border border-white/60 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline backdrop-blur-sm shadow-inner" placeholder="example@email.com" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface ml-1">Mật khẩu</label>
<input class="w-full px-5 py-4 rounded-2xl bg-white/50 border border-white/60 focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow font-body-md text-body-md text-on-surface placeholder:text-outline backdrop-blur-sm shadow-inner" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between mt-2 px-1">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-outline-variant text-primary focus:ring-primary w-4 h-4 bg-white/50" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant text-sm">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:underline hover:text-primary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<button class="w-full mt-4 gradient-btn text-on-primary py-4 rounded-2xl font-label-sm text-label-sm font-bold transition-all duration-300" type="button">Đăng nhập</button>
</form>
</div>
</div>
<script>
        function switchTab(tab) {
            const registerForm = document.getElementById('form-register');
            const loginForm = document.getElementById('form-login');
            const registerTab = document.getElementById('tab-register');
            const loginTab = document.getElementById('tab-login');
            const subtitle = document.getElementById('auth-subtitle');

            // Reset styles
            registerTab.className = "flex-1 py-3 rounded-xl font-label-sm text-label-sm text-center transition-all text-on-surface-variant hover:text-on-surface hover:bg-white/30";
            loginTab.className = "flex-1 py-3 rounded-xl font-label-sm text-label-sm text-center transition-all text-on-surface-variant hover:text-on-surface hover:bg-white/30";

            if (tab === 'register') {
                registerForm.classList.remove('hidden');
                registerForm.classList.add('flex');
                loginForm.classList.add('hidden');
                loginForm.classList.remove('flex');
                
                registerTab.className = "flex-1 py-3 rounded-xl font-label-sm text-label-sm text-center transition-all bg-white text-primary shadow-sm font-bold";
                subtitle.innerText = "Tạo tài khoản mới";
            } else {
                loginForm.classList.remove('hidden');
                loginForm.classList.add('flex');
                registerForm.classList.add('hidden');
                registerForm.classList.remove('flex');
                
                loginTab.className = "flex-1 py-3 rounded-xl font-label-sm text-label-sm text-center transition-all bg-white text-primary shadow-sm font-bold";
                subtitle.innerText = "Đăng nhập vào hệ thống";
            }
        }
    </script>
</body></html>
