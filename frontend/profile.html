<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            margin: 40px 0 80px;
        }
        .avatar-container {
            text-align: center;
            margin-bottom: 24px;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            background: var(--bg-darker);
            margin: 0 auto 16px;
        }
        .prog-card-item {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prog-info {
            flex: 1;
            margin-right: 24px;
        }
        .prog-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .prog-bar-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }
        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-badge.in_progress {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .status-badge.completed {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <main class="container">
        <div id="loading" style="text-align: center; padding: 100px 0;">
            <p style="color: var(--text-muted);">Đang tải thông tin cá nhân...</p>
        </div>

        <div id="profile-content" class="profile-grid" style="display: none;">
            <div>
                <div class="card">
                    <div class="avatar-container">
                        <img id="avatar-img" src="" class="profile-avatar" alt="User Avatar">
                        <h3 id="display-name" style="font-size: 20px;">Tên hiển thị</h3>
                        <span id="display-role" style="font-size: 13px; color: var(--accent); font-weight: 600; text-transform: uppercase; display: block; margin-top: 4px;">Role</span>
                    </div>

                    <form id="profile-form" onsubmit="handleProfileUpdate(event)">
                        <div class="form-group">
                            <label class="form-label" for="profile-name">Họ và tên</label>
                            <input class="form-control" type="text" id="profile-name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="profile-gender">Giới tính</label>
                            <select class="form-control" id="profile-gender">
                                <option value="">Chưa thiết lập</option>
                                <option value="MALE">Nam</option>
                                <option value="FEMALE">Nữ</option>
                                <option value="OTHER">Khác</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="profile-dob">Ngày sinh</label>
                            <input class="form-control" type="date" id="profile-dob">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="profile-phone">Số điện thoại</label>
                            <input class="form-control" type="text" id="profile-phone">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="profile-avatar">Link ảnh đại diện</label>
                            <input class="form-control" type="text" id="profile-avatar" placeholder="https://image-url.com/avatar.jpg">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="profile-bio">Tiểu sử (Bio)</label>
                            <textarea class="form-control" id="profile-bio" rows="3" placeholder="Giới thiệu ngắn về bản thân..."></textarea>
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" type="submit">Lưu Thay Đổi</button>
                    </form>
                </div>
            </div>

            <div>
                <div id="learning-progress-sec" class="card" style="display: none; margin-bottom: 32px;">
                    <h3 style="font-size: 22px; margin-bottom: 24px;">Tiến độ học tập cá nhân</h3>
                    <div id="my-courses-container">
                        <!-- Enrolled courses stats listed dynamically -->
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-size: 22px; margin-bottom: 16px;">Tài Khoản Hệ Thống</h3>
                    <div style="font-size: 14px; color: var(--text-muted); display: flex; flex-direction: column; gap: 12px;">
                        <p>Username: <strong id="acc-username" style="color: var(--text-main);"></strong></p>
                        <p>Email liên kết: <strong id="acc-email" style="color: var(--text-main);"></strong></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        if (!api.isAuthenticated()) {
            window.location.href = "auth.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadUserProfile();
        });

        async function loadUserProfile() {
            try {
                const res = await api.get('/users/profile');
                if (res.success) {
                    const u = res.data;
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profile-content').style.display = 'grid';

                    document.getElementById('avatar-img').src = u.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120';
                    document.getElementById('display-name').textContent = u.full_name;
                    
                    const roleText = u.role === 'ADMIN' ? 'Quản trị viên' : u.role === 'INSTRUCTOR' ? 'Giảng viên' : u.role === 'STUDENT_PARENT' ? 'Phụ huynh' : 'Học sinh';
                    document.getElementById('display-role').textContent = roleText;

                    document.getElementById('acc-username').textContent = u.username;
                    document.getElementById('acc-email').textContent = u.email;

                    document.getElementById('profile-name').value = u.full_name;
                    document.getElementById('profile-gender').value = u.gender || '';
                    document.getElementById('profile-dob').value = u.date_of_birth || '';
                    document.getElementById('profile-phone').value = u.phone_number || '';
                    document.getElementById('profile-avatar').value = u.avatar_url || '';
                    document.getElementById('profile-bio').value = u.bio || '';

                    if (u.role === 'STUDENT_PARENT' || u.role === 'STUDENT_CHILD') {
                        document.getElementById('learning-progress-sec').style.display = 'block';
                        loadMyCourses();
                    }
                }
            } catch (err) {
                alert("Lỗi khi tải thông tin tài khoản: " + err.message);
                api.clearAuth();
                window.location.href = "auth.html";
            }
        }

        async function loadMyCourses() {
            const container = document.getElementById('my-courses-container');
            container.innerHTML = '<p style="color: var(--text-muted);">Đang tải tiến trình học...</p>';
            
            try {
                const res = await api.get('/users/my-courses');
                if (res.success) {
                    const courses = res.data;
                    if (courses.length === 0) {
                        container.innerHTML = `<p style="color: var(--text-muted); padding: 16px 0;">Bạn chưa đăng ký khóa học nào.</p>
                        <a href="courses.html" class="btn btn-outline" style="margin-top: 8px;">Đăng ký khóa học ngay</a>`;
                        return;
                    }
                    
                    container.innerHTML = courses.map(course => `
                        <div class="prog-card-item">
                            <div class="prog-info">
                                <h4 style="font-size: 16px; margin-bottom: 4px;">${course.course_title}</h4>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <span class="status-badge ${course.status.toLowerCase()}">${course.status === 'COMPLETED' ? 'Hoàn thành' : 'Đang học'}</span>
                                    <span style="font-size: 12px; color: var(--text-muted);">${course.completed_lessons}/${course.total_lessons} bài học (${course.progress_percentage}%)</span>
                                </div>
                                <div class="prog-bar-bg">
                                    <div class="prog-bar-fill" style="width: ${course.progress_percentage}%"></div>
                                </div>
                            </div>
                            <a href="course-learn.html?id=${course.course_id}" class="btn btn-outline btn-sm">Vào học</a>
                        </div>
                    `).join('');
                }
            } catch (err) {
                container.innerHTML = `<p style="color: var(--danger);">${err.message || 'Lỗi khi tải danh sách khóa học.'}</p>`;
            }
        }

        async function handleProfileUpdate(event) {
            event.preventDefault();
            
            const full_name = document.getElementById('profile-name').value;
            const gender = document.getElementById('profile-gender').value || null;
            const date_of_birth = document.getElementById('profile-dob').value || null;
            const phone_number = document.getElementById('profile-phone').value || null;
            const avatar_url = document.getElementById('profile-avatar').value || null;
            const bio = document.getElementById('profile-bio').value || null;

            try {
                const res = await api.put('/users/profile', {
                    full_name,
                    gender,
                    date_of_birth,
                    phone_number,
                    avatar_url,
                    bio
                });
                
                if (res.success) {
                    alert("Cập nhật hồ sơ thành công!");
                    const user = api.getUserInfo();
                    user.full_name = full_name;
                    localStorage.setItem("user_info", JSON.stringify(user));
                    loadUserProfile();
                }
            } catch (err) {
                alert("Lỗi khi cập nhật hồ sơ: " + err.message);
            }
        }
    </script>
</body>
</html>
