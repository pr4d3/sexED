<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Giảng Viên - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0 20px;
            border-bottom: 1px solid var(--border-card);
            margin-bottom: 32px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        .stat-card {
            text-align: center;
            padding: 24px;
        }
        .stat-val {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Outfit', sans-serif;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 32px;
            margin-bottom: 80px;
        }
        .item-list {
            list-style: none;
        }
        .item-row {
            padding: 16px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-row:hover, .item-row.active {
            background: rgba(124, 58, 237, 0.05);
            border-color: var(--primary);
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .table th, .table td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-card);
        }
        .table th {
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
        }
        .table tr:hover {
            background: rgba(255, 255, 255, 0.01);
        }
        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-badge.in_progress {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .status-badge.completed {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <main class="container">
        <div class="dashboard-header">
            <div>
                <h1 style="font-size: 32px;">Bảng Điều Khiển Giảng Viên</h1>
                <p id="dashboard-subtitle" style="color: var(--text-muted); font-size: 14px;">Quản lý và đánh giá học viên</p>
            </div>
            <button onclick="openCreateCourseModal()" class="btn btn-primary">Tạo Khóa Học Mới</button>
        </div>

        <section class="stats-grid">
            <div class="card stat-card">
                <div id="stat-courses" class="stat-val">0</div>
                <div class="stat-label">Khóa học</div>
            </div>
            <div class="card stat-card">
                <div id="stat-enrolled" class="stat-val">0</div>
                <div class="stat-label">Học viên đăng ký</div>
            </div>
            <div class="card stat-card">
                <div id="stat-completed" class="stat-val">0</div>
                <div class="stat-label">Đã hoàn thành</div>
            </div>
            <div class="card stat-card">
                <div id="stat-rate" class="stat-val">0%</div>
                <div class="stat-label">Tỷ lệ hoàn thành</div>
            </div>
            <div class="card stat-card">
                <div id="stat-lessons" class="stat-val">0</div>
                <div class="stat-label">Bài học công bố</div>
            </div>
        </section>

        <div class="dashboard-grid">
            <section class="card">
                <h3 style="font-size: 18px; margin-bottom: 20px;">Khóa học của tôi</h3>
                <ul id="my-managed-courses" class="item-list">
                    <!-- Loaded dynamically -->
                </ul>
            </section>

            <section class="card">
                <h3 style="font-size: 18px; margin-bottom: 20px;">Tiến độ học viên: <span id="selected-course-title" style="color: var(--primary);">Chưa chọn khóa học</span></h3>
                <div style="overflow-x: auto;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Học viên</th>
                                <th>Vai trò</th>
                                <th>Tiến trình</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body">
                            <tr>
                                <td colspan="4" style="text-align: center; color: var(--text-muted);">Vui lòng chọn một khóa học ở cột bên trái.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Create Course Modal -->
    <div id="create-course-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="modal-close" onclick="closeCreateCourseModal()">&times;</button>
            <h3 style="font-size: 20px; margin-bottom: 20px;">Tạo Khóa Học Mới</h3>
            <form onsubmit="handleCreateCourse(event)">
                <div class="form-group">
                    <label class="form-label" for="c-title">Tiêu đề khóa học</label>
                    <input class="form-control" type="text" id="c-title" required placeholder="Ví dụ: Giáo dục giới tính tuổi dậy thì">
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-slug">Slug (Đường dẫn tĩnh)</label>
                    <input class="form-control" type="text" id="c-slug" required placeholder="giao-duc-gioi-tinh-tuoi-day-thi">
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-audience">Đối tượng hướng đến</label>
                    <select class="form-control" id="c-audience" required>
                        <option value="BOTH">Tất cả lứa tuổi (BOTH)</option>
                        <option value="CHILD">Trẻ vị thành niên (CHILD)</option>
                        <option value="PARENT">Phụ huynh học sinh (PARENT)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-thumb">Link ảnh Thumbnail</label>
                    <input class="form-control" type="text" id="c-thumb" placeholder="https://image-url.com/thumb.jpg">
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-short">Mô tả ngắn</label>
                    <input class="form-control" type="text" id="c-short" placeholder="Tóm tắt nội dung khóa học trong 1-2 dòng...">
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-desc">Mô tả chi tiết</label>
                    <textarea class="form-control" id="c-desc" rows="4" placeholder="Nội dung chi tiết mục tiêu, đề cương khóa học..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Tạo Khóa Học (Bản nháp)</button>
            </form>
        </div>
    </div>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        const user = api.getUserInfo();
        if (!api.isAuthenticated() || (user.role !== 'ADMIN' && user.role !== 'INSTRUCTOR')) {
            window.location.href = "index.html";
        }

        let managedCourses = [];
        let selectedCourseId = null;

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('dashboard-subtitle').textContent = `Chào ${user.full_name}, vai trò: ${user.role}`;
            loadDashboardStats();
            loadManagedCourses();
        });

        async function loadDashboardStats() {
            try {
                const res = await api.get('/instructor/dashboard/overview');
                if (res.success) {
                    const stats = res.data;
                    document.getElementById('stat-courses').textContent = stats.total_courses;
                    document.getElementById('stat-enrolled').textContent = stats.total_students_enrolled;
                    document.getElementById('stat-completed').textContent = stats.total_completed_students;
                    document.getElementById('stat-rate').textContent = `${stats.average_completion_rate}%`;
                    document.getElementById('stat-lessons').textContent = stats.total_lessons_published;
                }
            } catch (err) {
                console.error("Error loading statistics", err);
            }
        }

        async function loadManagedCourses() {
            const list = document.getElementById('my-managed-courses');
            list.innerHTML = '<p style="color: var(--text-muted); padding: 16px;">Đang tải danh sách...</p>';
            
            try {
                const res = await api.get('/instructor/dashboard/courses');
                if (res.success) {
                    managedCourses = res.data;
                    if (managedCourses.length === 0) {
                        list.innerHTML = '<p style="color: var(--text-muted); padding: 16px;">Bạn chưa quản lý khóa học nào.</p>';
                        return;
                    }
                    
                    list.innerHTML = managedCourses.map((c, idx) => `
                        <li class="item-row ${c.course_id === selectedCourseId ? 'active' : ''}" id="course-row-${c.course_id}" onclick="selectCourse('${c.course_id}', '${c.title}')">
                            <div>
                                <strong style="font-size: 15px; display: block; margin-bottom: 4px;">${c.title}</strong>
                                <span style="font-size: 11px; color: var(--text-muted);">Đối tượng: ${c.target_audience} | Bài học: ${c.total_lessons}</span>
                            </div>
                            <span style="font-size: 12px; font-weight: 600; color: var(--primary);">${c.total_enrolled} học viên</span>
                        </li>
                    `).join('');
                }
            } catch (err) {
                list.innerHTML = `<p style="color: var(--danger); padding: 16px;">${err.message || 'Lỗi tải danh sách.'}</p>`;
            }
        }

        async function selectCourse(courseId, title) {
            selectedCourseId = courseId;
            
            document.querySelectorAll('.item-row').forEach(row => row.classList.remove('active'));
            const activeRow = document.getElementById(`course-row-${courseId}`);
            if (activeRow) activeRow.classList.add('active');

            document.getElementById('selected-course-title').textContent = title;
            
            const tbody = document.getElementById('students-table-body');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Đang tải tiến độ học viên...</td></tr>';

            try {
                const res = await api.get(`/instructor/dashboard/courses/${courseId}/students`);
                if (res.success) {
                    const students = res.data.students;
                    if (students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Chưa có học viên nào đăng ký học khóa này.</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = students.map(student => `
                        <tr>
                            <td>
                                <strong>${student.full_name}</strong>
                                <span style="font-size: 11px; color: var(--text-muted); display: block;">${student.email}</span>
                            </td>
                            <td>${student.role === 'STUDENT_PARENT' ? 'Phụ huynh' : 'Trẻ nhỏ'}</td>
                            <td>
                                <strong>${student.progress_percentage}%</strong>
                                <span style="font-size: 11px; color: var(--text-muted); display: block;">${student.completed_lessons_count} bài học</span>
                            </td>
                            <td>
                                <span class="status-badge ${student.status.toLowerCase()}">${student.status === 'COMPLETED' ? 'Hoàn thành' : 'Đang học'}</span>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--danger);">${err.message || 'Lỗi tải tiến trình học viên.'}</td></tr>`;
            }
        }

        function openCreateCourseModal() {
            document.getElementById('create-course-modal').classList.add('active');
        }
        function closeCreateCourseModal() {
            document.getElementById('create-course-modal').classList.remove('active');
        }
        async function handleCreateCourse(event) {
            event.preventDefault();
            const title = document.getElementById('c-title').value;
            const slug = document.getElementById('c-slug').value;
            const target_audience = document.getElementById('c-audience').value;
            const thumbnail_url = document.getElementById('c-thumb').value || null;
            const short_description = document.getElementById('c-short').value || null;
            const description = document.getElementById('c-desc').value || null;

            try {
                const res = await api.post('/courses', {
                    title, slug, target_audience, thumbnail_url, short_description, description
                });
                if (res.success) {
                    alert("Tạo khóa học nháp thành công!");
                    closeCreateCourseModal();
                    
                    document.getElementById('c-title').value = '';
                    document.getElementById('c-slug').value = '';
                    document.getElementById('c-thumb').value = '';
                    document.getElementById('c-short').value = '';
                    document.getElementById('c-desc').value = '';
                    
                    loadManagedCourses();
                    loadDashboardStats();
                }
            } catch (err) {
                alert("Lỗi tạo khóa học: " + err.message);
            }
        }
    </script>
</body>
</html>
