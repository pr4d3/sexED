<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực - ChiChan SexEd Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            width: 100%;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-card);
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .auth-tab.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--primary);
            margin-bottom: -2px;
        }
        .auth-panel {
            display: none;
        }
        .auth-panel.active {
            display: block;
        }
        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .success-message {
            color: var(--success);
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <main class="container">
        <div class="auth-container card">
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Đăng Nhập</div>
                <div class="auth-tab" onclick="switchTab('register')">Đăng Ký</div>
            </div>
            
            <div id="error-alert" class="error-message"></div>
            <div id="success-alert" class="success-message"></div>

            <!-- Login Panel -->
            <div id="login-panel" class="auth-panel active">
                <form id="login-form" onsubmit="handleLoginSubmit(event)">
                    <div class="form-group">
                        <label class="form-label" for="login-ident">Tên đăng nhập hoặc Email</label>
                        <input class="form-control" type="text" id="login-ident" required placeholder="nhap_tai_khoan_hoac_email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password">Mật khẩu</label>
                        <input class="form-control" type="password" id="login-password" required placeholder="******">
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 12px;" type="submit">Đăng Nhập</button>
                </form>
            </div>

            <!-- Register Panel -->
            <div id="register-panel" class="auth-panel">
                <form id="register-form" onsubmit="handleRegisterSubmit(event)">
                    <div class="form-group">
                        <label class="form-label" for="reg-fullname">Họ và tên</label>
                        <input class="form-control" type="text" id="reg-fullname" required placeholder="Nguyễn Văn An">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-username">Tên đăng nhập</label>
                        <input class="form-control" type="text" id="reg-username" required placeholder="van_an_99">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email</label>
                        <input class="form-control" type="email" id="reg-email" required placeholder="an@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-password">Mật khẩu (tối thiểu 6 ký tự)</label>
                        <input class="form-control" type="password" id="reg-password" required minlength="6" placeholder="******">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-role">Bạn là?</label>
                        <select class="form-control" id="reg-role" required>
                            <option value="STUDENT_PARENT">Phụ huynh (Đồng hành cùng con)</option>
                            <option value="STUDENT_CHILD">Học sinh / Trẻ vị thành niên</option>
                        </select>
                    </div>
                    <button class="btn btn-accent" style="width: 100%; margin-top: 12px;" type="submit">Đăng Ký</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        if (api.isAuthenticated()) {
            window.location.href = "index.html";
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.auth-panel').forEach(el => el.classList.remove('active'));
            document.getElementById('error-alert').style.display = 'none';
            document.getElementById('success-alert').style.display = 'none';

            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-panel').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('register-panel').classList.add('active');
            }
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const username_or_email = document.getElementById('login-ident').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await api.post('/auth/login', { username_or_email, password });
                if (res.success) {
                    api.saveAuth(res.data.access_token, res.data.refresh_token, res.data.user);
                    successAlert.textContent = "Đăng nhập thành công! Đang chuyển hướng...";
                    successAlert.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                }
            } catch (err) {
                errorAlert.textContent = err.message || "Đăng nhập thất bại.";
                errorAlert.style.display = 'block';
            }
        }

        async function handleRegisterSubmit(event) {
            event.preventDefault();
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const full_name = document.getElementById('reg-fullname').value;
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role_code = document.getElementById('reg-role').value;

            try {
                const res = await api.post('/auth/register', { full_name, username, email, password, role_code });
                if (res.success) {
                    successAlert.textContent = "Đăng ký thành công! Đang chuyển sang Đăng nhập...";
                    successAlert.style.display = 'block';
                    document.getElementById('register-form').reset();
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('login-ident').value = username;
                    }, 1500);
                }
            } catch (err) {
                errorAlert.textContent = err.message || "Đăng ký thất bại.";
                errorAlert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
