<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa Học - ChiChan SexEd</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .courses-header {
            padding: 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            margin-bottom: 40px;
        }
        .filter-group {
            display: flex;
            gap: 12px;
        }
        .filter-btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }
        .filter-btn.active, .filter-btn:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
        }
        .course-card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .course-img {
            width: 100%;
            height: 180px;
            background: var(--bg-darker);
            border-radius: var(--radius-sm);
            object-fit: cover;
            margin-bottom: 16px;
        }
        .course-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 52px;
        }
        .course-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }
        .course-card .btn {
            margin-top: auto;
            width: 100%;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-card);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.parent {
            color: var(--accent);
            border-color: rgba(249, 115, 22, 0.3);
        }
        .badge.child {
            color: var(--primary);
            border-color: rgba(124, 58, 237, 0.3);
        }
        .badge.both {
            color: var(--success);
            border-color: rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <header class="navbar"></header>

    <main class="container" style="padding-bottom: 80px;">
        <div class="courses-header">
            <div>
                <h1 style="font-size: 32px;">Danh Sách Khóa Học</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Học liệu chính xác từ nghiên cứu khoa học</p>
            </div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('ALL')">Tất cả</button>
                <button class="filter-btn" onclick="setFilter('CHILD')">Dành cho Trẻ dậy thì</button>
                <button class="filter-btn" onclick="setFilter('PARENT')">Dành cho Phụ huynh</button>
            </div>
        </div>

        <div id="courses-grid" class="grid-layout">
            <!-- Courses load here -->
        </div>
    </main>

    <footer class="footer"></footer>

    <script src="js/api.js"></script>
    <script>
        let currentFilter = 'ALL';

        document.addEventListener("DOMContentLoaded", () => {
            loadCourses();
        });

        async function loadCourses() {
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Đang tải danh sách khóa học...</p>';
            
            try {
                let url = '/courses';
                if (currentFilter !== 'ALL') {
                    url += `?target_audience=${currentFilter}`;
                }
                const res = await api.get(url);
                if (res.success) {
                    renderCourses(res.data);
                }
            } catch (err) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--danger); padding: 40px 0;">${err.message || 'Lỗi khi tải dữ liệu.'}</p>`;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            const btnIdx = filter === 'ALL' ? 0 : filter === 'CHILD' ? 1 : 2;
            document.querySelectorAll('.filter-btn')[btnIdx].classList.add('active');
            
            loadCourses();
        }

        function renderCourses(courses) {
            const grid = document.getElementById('courses-grid');
            if (courses.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Không có khóa học nào phù hợp.</p>`;
                return;
            }
            
            grid.innerHTML = courses.map(course => {
                const aud = course.target_audience;
                const badgeClass = aud.toLowerCase();
                const badgeText = aud === 'PARENT' ? 'Phụ huynh' : aud === 'CHILD' ? 'Trẻ nhỏ' : 'Tất cả';
                
                return `
                    <div class="card course-card">
                        <img src="${course.thumbnail_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500'}" class="course-img" alt="${course.title}">
                        <div style="margin-bottom: 12px;">
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <h3>${course.title}</h3>
                        <div class="course-meta">
                            <span>Giảng viên: <strong>${course.instructor_name}</strong></span>
                            <span>Bài học: <strong>${course.total_lessons}</strong></span>
                        </div>
                        <a href="course-intro.html?id=${course.id}" class="btn btn-primary">Xem Chi Tiết</a>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
